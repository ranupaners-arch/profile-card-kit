# Generate the Pac-Man contribution-graph animation (abozanona/pacman-contribution-graph),
# then add a running contribution counter with `python -m profilecard pacman`.
name: Pacman contribution graph

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pacman.yaml"
      - "profilecard/templates/pacman.py"

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check profile.yaml was customised
        id: gate
        run: |
          if grep -qE '^github_username:[[:space:]]*octocat[[:space:]]*$' profile.yaml; then
            echo "profile.yaml still uses the placeholder username; skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # github_username falls back to the repository owner when empty in profile.yaml.
      - name: Resolve username
        if: steps.gate.outputs.ready == 'true'
        id: user
        run: |
          name=$(sed -nE 's/^github_username:[[:space:]]*"?([^"#[:space:]]+)"?.*$/\1/p' profile.yaml | head -n1)
          echo "name=${name:-$GITHUB_REPOSITORY_OWNER}" >> "$GITHUB_OUTPUT"

      # Consider pinning this action to a commit SHA once you have reviewed it.
      - name: Generate pacman SVG
        if: steps.gate.outputs.ready == 'true'
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ steps.user.outputs.name }}
          github_token: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Copy SVG
        if: steps.gate.outputs.ready == 'true'
        run: |
          mkdir -p output/pacman
          cp dist/pacman-contribution-graph-dark.svg output/pacman/dark.svg
          cp dist/pacman-contribution-graph.svg output/pacman/light.svg

      - name: Set up Python
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: python -m pip install -r requirements.txt

      - name: Add contribution counter
        if: steps.gate.outputs.ready == 'true'
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python -m profilecard pacman

      - name: Commit
        if: steps.gate.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/pacman
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "chore(profile): refresh pacman animation"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
